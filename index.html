<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4F9E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace du bureau · Club Civil · ENSA Tétouan</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#F3F5F6; --surface:#FFFFFF; --ink:#1C2733; --muted:#5B6672;
  --line:#D3D9DE; --steel:#1F4F9E; --steel-soft:#E3EAF6; --ochre:#EE6A1F; --ochre-soft:#FDEBDF;
  --sans:"Archivo","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12181E; --surface:#1A222A; --ink:#E4E9ED; --muted:#98A4AF;
    --line:#2F3B46; --steel:#8DB0EA; --steel-soft:#1C2A40; --ochre:#F48A4A; --ochre-soft:#3A2518;
  }
}
:root[data-theme="dark"]{
  --paper:#12181E; --surface:#1A222A; --ink:#E4E9ED; --muted:#98A4AF;
  --line:#2F3B46; --steel:#8DB0EA; --steel-soft:#1C2A40; --ochre:#F48A4A; --ochre-soft:#3A2518;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
img{max-width:100%}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

/* En-tête : les deux logos encadrent le titre, comme le cartouche du PV */
.head{background:var(--surface);border-bottom:1px solid var(--line)}
.head-inner{max-width:1080px;margin:0 auto;padding:22px 16px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.logo{height:84px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px;display:flex}
.logo img{height:100%;width:auto}
.title{text-align:center;min-width:0}
.title .org{font-size:13px;color:var(--muted);line-height:1.35}
.title h1{margin:4px 0 2px;font-size:clamp(22px,3.4vw,32px);font-weight:800;line-height:1.1;letter-spacing:-.2px}
.title .year{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--steel);background:var(--steel-soft);padding:3px 10px;border-radius:999px}

main{max-width:1080px;margin:0 auto;padding:22px 16px 48px}

/* Reprise du brouillon de PV */
.resume{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ochre);border-radius:8px;padding:14px 16px;margin-bottom:26px}
.resume[hidden]{display:none}
.resume p{margin:0;flex:1;min-width:220px}
.resume b{display:block;font-size:15px}
.resume span{font-size:13.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--ochre);border-color:var(--ochre);color:#1B1305}

/* Pôles et outils */
.pole{margin-bottom:26px}
.pole h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.pole h2::after{content:"";flex:1;height:1px;background:var(--line)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tile{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;color:inherit;text-decoration:none;min-height:96px}
a.tile{transition:border-color .15s, transform .15s, box-shadow .15s}
a.tile:hover{border-color:var(--steel);transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,40,80,.08)}
.ico{flex:none;width:42px;height:42px;border-radius:8px;display:grid;place-items:center;background:var(--steel-soft);color:var(--steel)}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile h3{margin:0 0 3px;font-size:16px;font-weight:700;line-height:1.25}
.tile p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.4}
.tile.live .ico{background:var(--ochre-soft);color:var(--ochre)}
.tile.soon{border-style:dashed;background:transparent}
.tile.soon .ico{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.tile.soon h3{color:var(--muted)}
.badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tile.live .badge{background:var(--ochre-soft);color:var(--ochre);border-color:transparent}
.tile h3{padding-right:62px}
.tile > div{min-width:0;flex:1}

footer{max-width:1080px;margin:0 auto;padding:0 16px 30px;font-size:13px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
footer .sp{flex:1}
#installBtn[hidden]{display:none}

@media (max-width:640px){
  .head-inner{grid-template-columns:1fr 1fr;gap:12px}
  .title{grid-column:1 / -1;grid-row:1}
  .logo{height:64px;justify-self:center}
}
@media (prefers-reduced-motion:reduce){a.tile{transition:none}a.tile:hover{transform:none}}
</style>
</head>

<main>
  <div class="resume" id="resume" hidden>
    <p><b>Un PV est en cours de rédaction</b><span id="resumeInfo"></span></p>
    <a class="btn primary" href="pv.html">Reprendre le PV</a>
  </div>

  <div id="poles"></div>
</main>

<footer>
  <span>Club Civil · ENSA Tétouan</span>
  <span class="sp"></span>
  <span id="offline">Une fois installé, l'espace fonctionne sans connexion.</span>
  <button class="btn" id="installBtn" hidden>Installer l'application</button>
</footer>

<script>
(function(){
/* Icônes (traits simples) */
const I = {
  pv:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h4"/>',
  members:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.4.2 4 1.8 4.5 4.8"/>',
  cert:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M7 8h10M7 11h6"/><circle cx="16" cy="17" r="2.5"/><path d="M14.8 19l-.8 2.5 2-1 2 1-.8-2.5"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v5M17.5 9.5v5"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 10h18M7 15h4"/>',
  tasks:'<path d="M4 6.5l1.5 1.5L8.5 5M4 12.5l1.5 1.5 3-3M4 18.5l1.5 1.5 3-3"/><path d="M11.5 7h8.5M11.5 13h8.5M11.5 19h8.5"/>',
  ticket:'<path d="M3 8a2 2 0 0 0 0 4v0a2 2 0 0 1 0 4v2h18v-2a2 2 0 0 1 0-4 2 2 0 0 0 0-4V6H3z"/><path d="M14 6v12" stroke-dasharray="2 2"/>',
  check:'<rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V3h6v1"/><path d="M8.5 11l2 2 4-4M8.5 17h7"/>',
  learn:'<path d="M2.5 9L12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c1.5 1.5 3.3 2.2 5.5 2.2s4-.7 5.5-2.2V11"/><path d="M21.5 9v5"/>',
  mega:'<path d="M4 10v4h3l7 4V6L7 10z"/><path d="M17.5 9a4 4 0 0 1 0 6"/>',
  hand:'<path d="M3 12l4-4 4 2 3-2 7 5-3 3"/><path d="M7 8l6 7a1.4 1.4 0 0 0 2-2"/><path d="M11 17l-1-1M13.5 18.5l-1.5-1.5"/>',
  book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><circle cx="12" cy="8.5" r="1.8"/>'
};

/* Pôles et outils. Pour activer un outil plus tard : lui donner un lien (href). */
const POLES = [
  {name:'Secrétariat', tools:[
    {ico:'pv', title:'Procès-verbaux', desc:'Rédiger le PV d\'une réunion, faire signer et télécharger en PDF.', href:'pv.html'},
    {ico:'cert', title:'Attestations', desc:'Attestations de membre ou de participation, en PDF.'}
  ]},
  {name:'Trésorerie', tools:[
    {ico:'cash', title:'Caisse du club', desc:'Recettes, dépenses, solde et état financier pour l\'AG.'},
    {ico:'card', title:'Suivi des adhésions', desc:'Qui a réglé son adhésion, qui reste à relancer.'}
  ]},
  {name:'Ressources humaines', tools:[
    {ico:'members', title:'Registre des membres', desc:'Liste des membres, postes, coordonnées et adhésions, partagée avec le bureau.', href:'membres.html'},
    {ico:'tasks', title:'Suivi des tâches', desc:'Les actions décidées en réunion, suivies d\'une réunion à l\'autre.'}
  ]},
  {name:'Événements et formation', tools:[
    {ico:'ticket', title:'Inscriptions', desc:'Inscriptions aux sorties et événements, avec nombre de places.'},
    {ico:'check', title:'Checklist logistique', desc:'Liste réutilisable pour préparer chaque événement.'},
    {ico:'learn', title:'Besoins en formation', desc:'Recenser les formations souhaitées par les membres.'}
  ]},
  {name:'Communication et partenariats', tools:[
    {ico:'mega', title:'Modèles d\'annonces', desc:'Messages types pour annoncer réunions et événements.'},
    {ico:'hand', title:'Suivi des sponsors', desc:'Entreprises contactées, relances et conventions.'},
    {ico:'book', title:'Annuaire des contacts', desc:'Administration, clubs, alumni et professionnels.'}
  ]}
];

const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('poles').innerHTML = POLES.map(p=>
  '<section class="pole"><h2>'+esc(p.name)+'</h2><div class="tiles">'+p.tools.map(t=>{
    const inner='<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">'+I[t.ico]+'</svg></span>'+
      '<div><h3>'+esc(t.title)+'</h3><p>'+esc(t.desc)+'</p></div>';
    return t.href
      ? '<a class="tile live" href="'+t.href+'">'+inner+'<span class="badge">Ouvrir</span></a>'
      : '<div class="tile soon" aria-disabled="true">'+inner+'<span class="badge">Bientôt</span></div>';
  }).join('')+'</div></section>'
).join('');

/* Année universitaire */
const d=new Date(), y=d.getFullYear();
document.getElementById('year').textContent='Année universitaire '+(d.getMonth()>=8 ? y+'-'+(y+1) : (y-1)+'-'+y);

/* Brouillon de PV en cours (enregistré par l'outil PV sur cet appareil) */
try{
  const raw=localStorage.getItem('pv-club-genie-civil-ensat-v1');
  if(raw){
    const S=JSON.parse(raw), m=S.meeting||{};
    const filled = (m.num||m.place||m.chair||m.secretary) ||
      (S.attendees||[]).some(a=>a.name&&a.name.trim()) ||
      (S.agenda||[]).some(p=>(p.title||p.discussion||p.decision||'').trim());
    if(filled){
      const date = m.date ? new Date(m.date+'T12:00:00').toLocaleDateString('fr-FR') : '';
      document.getElementById('resumeInfo').textContent =
        [m.num ? 'PV n° '+m.num : null, date ? 'réunion du '+date : null, m.place||null].filter(Boolean).join(' · ') || 'Brouillon non numéroté';
      document.getElementById('resume').hidden=false;
    }
  }
}catch(e){}

/* Installation (Android / Chrome) */
let deferred=null; const ib=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; ib.hidden=false; });
ib.onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; ib.hidden=true; };
window.addEventListener('appinstalled',()=>{ ib.hidden=true; });
if(window.matchMedia('(display-mode: standalone)').matches) document.getElementById('offline').textContent='Application installée · fonctionne sans connexion.';
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
